{% load static %}
<div class="topbar-custom">
    <div class="container-fluid">
        <div class="d-flex justify-content-between">
            
            <ul class="list-unstyled topnav-menu mb-0 d-flex align-items-center">
                <li>
                    <button class="button-toggle-menu nav-link">
                        <i data-feather="menu" class="noti-icon"></i>
                    </button>
                </li>
                <li class="d-none d-lg-block">
                    <h5 class="mb-0">¡Hola, {{ user.username|capfirst }}!</h5>
                </li>
            </ul>

            <ul class="list-unstyled topnav-menu mb-0 d-flex align-items-center">
                
                <li class="d-none d-lg-block">
                    <form class="app-search d-none d-md-block me-auto">
                        <div class="position-relative topbar-search">
                            <input type="text" class="form-control ps-4" placeholder="Buscar..." />
                            <i class="mdi mdi-magnify fs-16 position-absolute text-muted top-50 translate-middle-y ms-2"></i>
                        </div>
                    </form>
                </li>

                <li class="d-none d-sm-flex">
                    <button type="button" class="btn nav-link" data-toggle="fullscreen">
                        <i data-feather="maximize" class="align-middle fullscreen noti-icon"></i>
                    </button>
                </li>

                <li class="d-none d-sm-flex">
                    <button type="button" class="btn nav-link" id="light-dark-mode">
                        <i data-feather="moon" class="align-middle dark-mode"></i>
                        <i data-feather="sun" class="align-middle light-mode"></i>
                    </button>
                </li>
                <li class="dropdown notification-list topbar-dropdown" 
                    id="notification-badge-container" 
                    hx-get="{% url 'seo:check_notifications' %}" 
                    hx-trigger="every 30s" 
                    hx-swap="innerHTML">
                    
                    {% include 'includes/notification_badge_partial.html' %}
                </li>
                

                <li class="dropdown notification-list topbar-dropdown">
                    <a class="nav-link dropdown-toggle nav-user me-0" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="false" aria-expanded="false">
                        <img src="{% static 'vendor/hando/images/users/user-11.jpg' %}" alt="user-image" class="rounded-circle" />
                        <span class="pro-user-name ms-1">{{ user.username|capfirst }} <i class="mdi mdi-chevron-down"></i></span>
                    </a>
                    <div class="dropdown-menu dropdown-menu-end profile-dropdown">
                        <div class="dropdown-header noti-title">
                            <h6 class="text-overflow m-0">Mi Cuenta</h6>
                        </div>
                        <a href="javascript:void(0);" class="dropdown-item notify-item">
                            <i class="fe-user"></i> <span>Perfil</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        
                        <form id="logout-form" action="{% url 'logout' %}" method="post" style="display: none;">
                            {% csrf_token %}
                        </form>
                        <a href="javascript:void(0);" class="dropdown-item notify-item" onclick="document.getElementById('logout-form').submit();">
                            <i class="fe-log-out"></i> <span>Cerrar Sesión</span>
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
