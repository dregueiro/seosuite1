    {{ form.media.css }}
    
  <style>
    /* 1. Ajuste del contenedor principal de TomSelect */
    .ts-wrapper {
        width: 100% !important;
        padding: 0 !important;
    }

    /* 2. Estilizar el control (el input visual) */
    /* Usamos .icon-field delante para que sepa que lleva icono */
    .icon-field .ts-wrapper .ts-control {
        width: 100% !important;
        min-height: 56px !important; /* Altura de 56px para match con el seed input */
        padding: 0 12px 0 45px !important; /* 45px a la izquierda para el icono */
        border: 1px solid #d1d5db !important; /* border-neutral-200 */
        border-radius: 12px !important; /* Radio de 12px como pediste */
        background-color: #ffffff !important;
        font-size: 14px !important;
        display: flex !important;
        align-items: center !important;
        transition: border-color 0.2s, box-shadow 0.2s !important;
        box-shadow: none !important; /* Quitamos sombras por defecto de Bootstrap */
    }

    /* 3. Comportamiento cuando el usuario hace clic (Focus) */
    .icon-field .ts-wrapper.focus .ts-control {
        border-color: #4f46e5 !important; /* primary-600 */
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1) !important;
    }

    /* 4. El icono de Wowdash debe estar por encima de todo */
    .icon-field .icon {
        position: absolute;
        left: 15px;
        z-index: 20 !important; /* Subimos el z-index para que no lo tape TomSelect */
        pointer-events: none;
        display: flex;
        align-items: center;
        color: #94a3b8; /* slate-400 */
    }

    /* 5. Estilizar el Dropdown (la lista de resultados) */
    .ts-dropdown {
        z-index: 9999 !important;
        border-radius: 12px !important;
        margin-top: 5px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
        padding: 8px !important;
    }

    /* 6. Estilizar los items dentro de la lista */
    .ts-dropdown .option {
        padding: 10px 12px !important;
        border-radius: 8px !important;
        cursor: pointer !important;
    }

    .ts-dropdown .active {
        background-color: #4f46e5 !important; /* primary-600 */
        color: #ffffff !important;
    }
</style>
{% block extra_css %}{% endblock %}
